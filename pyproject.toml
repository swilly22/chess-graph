[project]
name = "chess-graph"
version = "0.1.0"
description = "Transposition-aware chess opening graph built from the Lichess open database, stored in FalkorDB."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # Position identity, move generation, PGN/FEN/EPD parsing.
    "python-chess>=1.999",
    # Streaming decompression of the Lichess .pgn.zst / .jsonl.zst dumps.
    "zstandard>=0.22",
    # FalkorDB client (graph loading + queries).
    "falkordb>=1.0",
    # Out-of-core aggregation at full scale.
    "duckdb>=1.0",
    # Thin API in front of FalkorDB.
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "httpx>=0.27",  # FastAPI TestClient
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chess_graph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
